apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: main
spec:
  replicas: 1
  strategy:                 # RWO volume + SQLite: never run two pods at once
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:            # must stay identical to the live selector
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: main
    spec:
      serviceAccountName: n8n
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: n8n-main
          image: docker.io/library/n8n-ffmpeg:2.32.7
          imagePullPolicy: Never
          env:
            - {name: N8N_HIRING_BANNER_ENABLED, value: "false"}
            - {name: NODE_ENV, value: production}
            - {name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS, value: "true"}
            - {name: N8N_PORT, value: "5678"}
            - {name: N8N_DEFAULT_LOCALE, value: en}
            - {name: GENERIC_TIMEZONE, value: Asia/Dhaka}
            - {name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT, value: "30"}
            - {name: NPM_CONFIG_CACHE, value: /home/node/.cache/npm}
          envFrom:
            - configMapRef: {name: n8n-database-configmap}
            - configMapRef: {name: n8n-logging-configmap}
            - configMapRef: {name: n8n-diagnostics-configmap}
            - configMapRef: {name: n8n-version-notifications-configmap}
            - configMapRef: {name: n8n-public-api-configmap}
            - configMapRef: {name: n8n-workflow-history-configmap}
            - configMapRef: {name: n8n-task-broker-configmap}
            - configMapRef: {name: n8n-metrics-configmap}
            - configMapRef: {name: n8n-binary-data-configmap}
            - secretRef: {name: n8n-encryption-key-secret-v2}   # NOT in git
          ports:
            - {name: http, containerPort: 5678, protocol: TCP}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /home/node/.cache}
            - {name: npm-home, mountPath: /home/node/.npm}
            - {name: node-modules, mountPath: /home/node/.n8n}
        - name: ffmpeg-sidecar
          image: docker.io/library/ffmpeg-sidecar:1.3
          imagePullPolicy: Never
          ports:
            - {containerPort: 4000, protocol: TCP}
          volumeMounts:
            - {name: n8n-assets, mountPath: /app/assets, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: npm-home, emptyDir: {}}
        - name: node-modules
          persistentVolumeClaim: {claimName: n8n-main-persistence}
        - name: n8n-assets
          hostPath: {path: /opt/n8n-assets, type: Directory}
