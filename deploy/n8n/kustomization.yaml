apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

resources:
  - serviceaccount.yaml
  - configmaps.yaml
  - pvc.yaml
  - n8n-deployment.yaml
  - n8n-service.yaml
  - browser-sidecar.yaml
  - workflow-sync-job.yaml

# Bump tags here to roll out a new locally-built image
images:
  - name: docker.io/library/n8n-ffmpeg
    newTag: "2.32.7"
  - name: docker.io/library/ffmpeg-sidecar
    newTag: "1.3"
  - name: docker.io/library/browser-automation-sidecar
    newTag: v10

configMapGenerator:
  - name: n8n-workflow-sync-script
    files:
      - scripts/sync-workflows.sh
  # Add every workflow file here (kustomize does not support globs)
  - name: n8n-workflows
    files:
      - workflows/example-hello.json
      - workflows/job-circular-posts-bdgovtjob-rss-2x-daily.json
      - workflows/bcs-quiz-facebook-hourly.json
      - workflows/exam-results-leaderboard.json
      - workflows/weekly-exam-create-announce.json
      - workflows/facebook-story-teaser-3x-daily.json
      - workflows/questionmake-daily-facebook-scheduled-posts.json
      - workflows/facebook-ai-cards-mcq-info-ppt-feed-story.json
      - workflows/gk-news-web-search-facebook-twice-daily.json
      - workflows/prothom-alo-news-quiz-facebook.json
      - workflows/youtube-ai-cards-mcq-info-ppt-6x-daily.json
      - workflows/doa-page-daily-duas-7x.json
      - workflows/exam-reminder.json
      - workflows/post-to-facebook-page-questionhut.json
